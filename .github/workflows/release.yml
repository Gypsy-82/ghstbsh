name: release

# When you push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# this builds the static x86_64 Linux binary, generates its SHA-256, and attaches
# both to a GitHub Release. Non-Rust users then download + verify + run — no
# toolchain required.

on:
  push:
    tags:
      - "v*"

# Least privilege: the job only needs to write the Release. Nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (gitready Phase 8). To bump deliberately,
      # tag->SHA is listed at https://github.com/actions/checkout/tags
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build static musl binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/ghstbsh ghstbsh-x86_64-linux

      - name: Generate checksum
        run: sha256sum ghstbsh-x86_64-linux | tee ghstbsh-x86_64-linux.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-provided; no secret to configure
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ghstbsh-x86_64-linux ghstbsh-x86_64-linux.sha256 \
            --title "ghstbsh ${GITHUB_REF_NAME}" \
            --notes "Static x86_64 Linux binary (no Rust needed to run).
          Verify: \`sha256sum -c ghstbsh-x86_64-linux.sha256\`"
